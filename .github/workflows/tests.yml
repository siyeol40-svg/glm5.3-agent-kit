name: synthetic-regressions
on: [push, pull_request]
jobs:
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -S -m unittest discover -s tests/ppt-reference-fidelity -v
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests/ppt-reference-fidelity -v
