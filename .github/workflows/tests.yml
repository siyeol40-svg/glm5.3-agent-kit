name: synthetic-regressions
on: [push, pull_request]
jobs:
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -S -m unittest discover -s tests/ppt-reference-fidelity -v
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests/ppt-reference-fidelity -v
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native probe without starting Office
        shell: powershell
        run: |
          $tokens=$null
          $parseErrors=$null
          foreach ($script in Get-ChildItem "$pwd/.agents/skills/ppt-reference-fidelity/scripts/*.ps1") {
            $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          }
